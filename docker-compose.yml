services:
  postgres:
    image: postgres:16-alpine
    container_name: pecus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pecus
      POSTGRES_PASSWORD: pecus
      POSTGRES_DB: pecus
    ports:
      - "5432:5432"
    volumes:
      - pecus_pgdata:/var/lib/postgresql/data

volumes:
  pecus_pgdata:
